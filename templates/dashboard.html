<!DOCTYPE html>
<html lang="{{ settings.lang or 'en' }}" data-lang="{{ settings.lang or 'en' }}" data-theme="{{ settings.theme or 'dark' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TakhtJamshid Panel</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="bg-orbs"><span></span><span></span><span></span><span></span></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="logo-mark">𐎠</div>
    <span>TakhtJamshid</span>
  </div>
  <nav class="nav">
    <a class="nav-item active" data-page="overview"><i>◈</i> <span data-i18n="nav_overview">Dashboard</span></a>
    <a class="nav-item" data-page="inbounds"><i>⇄</i> <span data-i18n="nav_inbounds">Inbounds</span></a>
    <a class="nav-item" data-page="outbounds"><i>⇲</i> <span data-i18n="nav_outbounds">Outbounds</span></a>
    <a class="nav-item" data-page="routing"><i>⤳</i> <span data-i18n="nav_routing">Routing</span></a>
    <a class="nav-item" data-page="nodes"><i>⬢</i> <span data-i18n="nav_nodes">Nodes</span></a>
    <a class="nav-item" data-page="xray"><i>⚙</i> <span data-i18n="nav_xray">Xray Core</span></a>
    <a class="nav-item" data-page="logs"><i>≡</i> <span data-i18n="nav_logs">Logs</span></a>
    <a class="nav-item" data-page="settings"><i>⚒</i> <span data-i18n="nav_settings">Settings</span></a>
  </nav>
  <div class="sidebar-foot">
    <div class="xray-pill" id="xrayPill"><span class="dot"></span> Xray</div>
  </div>
</aside>

<!-- Main -->
<main class="main">
  <header class="topbar">
    <button class="icon-btn" id="menuToggle">☰</button>
    <h2 id="pageTitle">Dashboard</h2>
    <div class="topbar-right">
      <div class="lang-wrap">
        <button class="icon-btn" id="langToggle" title="Language">🌐</button>
        <div class="lang-menu" id="langMenu"></div>
      </div>
      <button class="icon-btn" id="themeToggle" title="Theme">🌙</button>
      <div class="user-chip">
        <span class="avatar" id="userAvatar">{{ username[0]|upper }}</span>
        <span id="userName">{{ username }}</span>
      </div>
      <a href="/logout" class="icon-btn" title="Logout">⏻</a>
    </div>
  </header>

  <div class="content" id="content">
    <div class="loader"><span class="spinner"></span></div>
  </div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="icon-btn" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>window.PANEL_USER = "{{ username }}";</script>
<script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
