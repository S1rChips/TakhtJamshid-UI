<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="{{ settings.theme or 'dark' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TakhtJamshid Panel</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="bg-orbs"><span></span><span></span><span></span></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="logo-mark">𐎠</div>
    <span>TakhtJamshid</span>
  </div>
  <nav class="nav">
    <a class="nav-item active" data-page="overview"><i>◈</i> داشبورد</a>
    <a class="nav-item" data-page="inbounds"><i>⇄</i> Inbounds</a>
    <a class="nav-item" data-page="outbounds"><i>⇲</i> Outbounds</a>
    <a class="nav-item" data-page="routing"><i>⤳</i> مسیریابی</a>
    <a class="nav-item" data-page="nodes"><i>⬢</i> نودها</a>
    <a class="nav-item" data-page="xray"><i>⚙</i> هسته Xray</a>
    <a class="nav-item" data-page="logs"><i>≡</i> لاگ‌ها</a>
    <a class="nav-item" data-page="settings"><i>⚒</i> تنظیمات</a>
  </nav>
  <div class="sidebar-foot">
    <div class="xray-pill" id="xrayPill"><span class="dot"></span> Xray</div>
  </div>
</aside>

<!-- Main -->
<main class="main">
  <header class="topbar">
    <button class="icon-btn" id="menuToggle">☰</button>
    <h2 id="pageTitle">داشبورد</h2>
    <div class="topbar-right">
      <button class="icon-btn" id="themeToggle" title="تغییر تم">🌙</button>
      <div class="user-chip">
        <span class="avatar">{{ username[0]|upper }}</span>
        <span>{{ username }}</span>
      </div>
      <a href="/logout" class="icon-btn" title="خروج">⏻</a>
    </div>
  </header>

  <div class="content" id="content">
    <!-- pages injected by app.js -->
    <div class="loader">در حال بارگذاری…</div>
  </div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-head">
      <h3 id="modalTitle">عنوان</h3>
      <button class="icon-btn" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>window.PANEL_USER = "{{ username }}";</script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
