<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود | TakhtJamshid</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
<div class="bg-orbs"><span></span><span></span><span></span></div>

<div class="login-card">
  <div class="login-logo">
    <div class="logo-mark">𐎠</div>
    <h1>TakhtJamshid</h1>
    <p>پنل مدیریت V2Ray / Xray</p>
  </div>
  <form id="loginForm">
    <div class="field">
      <label>نام کاربری</label>
      <input type="text" name="username" value="admin" autocomplete="username" required>
    </div>
    <div class="field">
      <label>رمز عبور</label>
      <input type="password" name="password" value="admin" autocomplete="current-password" required>
    </div>
    <div class="login-error" id="loginError"></div>
    <button type="submit" class="btn btn-primary btn-block">ورود به پنل</button>
  </form>
  <div class="login-foot">پیش‌فرض: admin / admin</div>
</div>

<script>
const form = document.getElementById('loginForm');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    username: form.username.value,
    password: form.password.value
  };
  const r = await fetch('/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  const data = await r.json();
  if (data.ok) { window.location = '/'; }
  else { document.getElementById('loginError').textContent = data.error || 'خطا'; }
});
</script>
</body>
</html>
